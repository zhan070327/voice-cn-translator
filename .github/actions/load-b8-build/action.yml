name: Load verified b8 Windows build
description: Download only the pinned GPU and CPU artifacts from the successful b8 Windows build
inputs:
  github-token:
    description: Read-only Actions token for the verified build run
    required: true
runs:
  using: composite
  steps:
    - name: Check that GitHub still reports the pinned run and artifacts as verified
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        sha=82e9e10abfb32ab72d49f98a88a1c670e1140c62
        git merge-base --is-ancestor "$sha" HEAD
        run="repos/$GITHUB_REPOSITORY/actions/runs/45756406388"
        gh api "$run" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$sha" '
          .status == "completed" and .conclusion == "success" and .run_attempt == 1
          and .event == "workflow_dispatch" and .path == ".github/workflows/windows-beta.yml" and .head_branch == "main"
          and .head_repository.full_name == $repo and .head_sha == $sha
        ' >/dev/null
        gh api "$run/attempts/1/jobs" | jq -e '
          def verified($edition):
            any(.jobs[]; .name == ("build (" + $edition + ")") and .conclusion == "success"
              and ([.steps[] | select(.conclusion == "success") | .name] as $passed
                | ["Test source", "Check bundled CUDA and quietly install the EXE",
                   "Record release checksums", "Upload tested installer"] - $passed == []));
          verified("gpu") and verified("cpu")
        ' >/dev/null
        gh api "$run/artifacts" | jq -e '
          any(.artifacts[]; .id == 15088029669 and .name == "windows-dual-gpu-45756406388-1" and .expired == false
              and .digest == "sha256:2309251a33944ff38c81d023d7b338940fcee6425babdf8caa25c88d995a19ff")
          and any(.artifacts[]; .id == 15088322497 and .name == "windows-dual-cpu-45756406388-1" and .expired == false
              and .digest == "sha256:7f4ca60fb685f19f31fd6d281ce53e56a466de8d0a3b3bc0866dada39044af93")
        ' >/dev/null
    - uses: actions/download-artifact@v4
      with:
        name: windows-dual-gpu-45756406388-1
        path: dist/paired/gpu
        run-id: 45756406388
        github-token: ${{ inputs.github-token }}
    - uses: actions/download-artifact@v4
      with:
        name: windows-dual-cpu-45756406388-1
        path: dist/paired/cpu
        run-id: 45756406388
        github-token: ${{ inputs.github-token }}
    - name: Verify both installer hashes, sizes, versions, notes and build receipts
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install 'packaging>=24,<27' -r requirements_publish.txt
        python -m scripts.publish_paired_release \
          --gpu dist/paired/gpu --cpu dist/paired/cpu \
          --expected-commit 82e9e10abfb32ab72d49f98a88a1c670e1140c62 \
          --expected-run 45756406388 --expected-attempt 1 | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Verify the validated manifest against the exact b4 updater
      shell: bash
      run: |
        python - <<'PY'
        import json
        import subprocess
        import types
        from pathlib import Path
        from scripts.publish_cos import DOWNLOAD_HOSTS
        from valorant_translator.updates.github import INSTALLER_NAME

        data = Path("dist/paired-latest.json").read_bytes()
        original = types.ModuleType("b4_domestic")
        exec(subprocess.check_output([
            "git", "show", "0571493f0c7eac412347635d7c3b74278923f7c0:valorant_translator/updates/domestic.py"
        ]), original.__dict__)
        current = original.parse_manifest(data, DOWNLOAD_HOSTS, "0.3.0b4")
        assert current is not None and str(current.version) == "0.3.0b8"
        assert current.url.endswith("/" + INSTALLER_NAME)
        manifest = json.loads(data)
        assert (current.url, current.size, current.sha256) == (
            manifest["download_url"], manifest["size"], manifest["sha256"],
        )
        print("The original b4 updater accepts the b8 GPU entry.")
        PY

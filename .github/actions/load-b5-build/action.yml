name: Load verified b5 Windows build
description: Download only the pinned GPU and CPU artifacts from the successful b5 Windows build
inputs:
  github-token:
    description: Read-only Actions token for the verified build run
    required: true
runs:
  using: composite
  steps:
    - name: Check that GitHub still reports the pinned run and artifacts as verified
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        sha=8cddb5c3c1796ca6685946add7614311d1852259
        git merge-base --is-ancestor "$sha" HEAD
        run="repos/$GITHUB_REPOSITORY/actions/runs/44600127347"
        gh api "$run" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$sha" '
          .status == "completed" and .conclusion == "success" and .run_attempt == 1
          and .path == ".github/workflows/windows-beta.yml" and .head_branch == "feature/b5-integrated"
          and .head_repository.full_name == $repo and .head_sha == $sha
        ' >/dev/null
        gh api "$run/artifacts" | jq -e '
          any(.artifacts[]; .id == 14568078101 and .name == "windows-dual-gpu-44600127347-1" and .expired == false)
          and any(.artifacts[]; .id == 14566299846 and .name == "windows-dual-cpu-44600127347-1" and .expired == false)
        ' >/dev/null
    - uses: actions/download-artifact@v4
      with:
        name: windows-dual-gpu-44600127347-1
        path: dist/paired/gpu
        run-id: 44600127347
        github-token: ${{ inputs.github-token }}
    - uses: actions/download-artifact@v4
      with:
        name: windows-dual-cpu-44600127347-1
        path: dist/paired/cpu
        run-id: 44600127347
        github-token: ${{ inputs.github-token }}
    - name: Verify both installer hashes, sizes, versions, notes and build receipts
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install 'packaging>=24,<27' -r requirements_publish.txt
        python -m scripts.publish_paired_release \
          --gpu dist/paired/gpu --cpu dist/paired/cpu \
          --expected-commit 8cddb5c3c1796ca6685946add7614311d1852259 \
          --expected-run 44600127347 --expected-attempt 1 | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Verify the validated manifest against the exact b4 updater
      shell: bash
      run: |
        python - <<'PY'
        import json
        import subprocess
        import types
        from pathlib import Path
        from scripts.publish_cos import DOWNLOAD_HOSTS
        from valorant_translator.updates.github import INSTALLER_NAME

        data = Path("dist/paired-latest.json").read_bytes()
        original = types.ModuleType("b4_domestic")
        exec(subprocess.check_output([
            "git", "show", "0571493f0c7eac412347635d7c3b74278923f7c0:valorant_translator/updates/domestic.py"
        ]), original.__dict__)
        current = original.parse_manifest(data, DOWNLOAD_HOSTS, "0.3.0b4")
        assert current is not None and str(current.version) == "0.3.0b5"
        assert current.url.endswith("/" + INSTALLER_NAME)
        assert current.sha256 == json.loads(data)["sha256"]
        print("The original b4 updater accepts the b5 GPU entry.")
        PY

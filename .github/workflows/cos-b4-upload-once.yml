name: One-time b4 installer upload to COS

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type UPLOAD 0.3.0b4 to upload or verify the pinned installer'
        required: true
        type: string
      endpoint:
        description: 'COS upload route; accelerate uses the bucket global acceleration feature'
        required: true
        type: choice
        default: direct
        options:
          - direct
          - accelerate

permissions:
  actions: read
  contents: read

concurrency:
  group: voicecn-cos-b4-installer
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Confirm exact b4 build and artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'UPLOAD 0.3.0b4' || { echo 'Confirmation mismatch'; exit 1; }
          [[ "$ENDPOINT" == 'direct' || "$ENDPOINT" == 'accelerate' ]] || { echo 'Invalid endpoint'; exit 1; }
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Run this workflow from main after review'; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44478207822")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .id == 44478207822 and .status == "completed" and .conclusion == "success"
            and .event == "workflow_dispatch"
            and .head_branch == "codex/windows-cloud-build"
            and .head_repository.full_name == $repo
            and .path == ".github/workflows/windows-beta.yml"
            and .head_sha == "0571493f0c7eac412347635d7c3b74278923f7c0"
            and .run_attempt == 1
          ' <<<"$run" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44478207822/artifacts?name=windows-domestic-44478207822-1" |
            jq -e 'any(.artifacts[];
              .id == 14508612725
              and .name == "windows-domestic-44478207822-1"
              and (.expired | not)
              and .digest == "sha256:9a644b34baa350ea32ea763e86b77732f1f8d72e1b67eb55509ca2234bf3bc13"
            )' >/dev/null
          echo 'commit=0571493f0c7eac412347635d7c3b74278923f7c0' >>"$GITHUB_OUTPUT"

  upload-installer:
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: cos-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-build.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: windows-domestic-44478207822-1
          run-id: 44478207822
          github-token: ${{ github.token }}
          path: dist
      - name: Verify installer and both build receipts
        id: installer
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path

          version = "0.3.0b4"
          commit = "0571493f0c7eac412347635d7c3b74278923f7c0"
          exe = Path("dist/VoiceCNTranslator_Beta_Setup.exe")
          assert exe.is_file(), "Installer missing from artifact"
          domestic = json.loads(Path("dist/domestic_build.json").read_text(encoding="utf-8-sig"))
          windows = json.loads(Path("dist/windows_build.json").read_text(encoding="utf-8-sig"))
          tree = ast.parse(Path("valorant_translator/version.py").read_text(encoding="utf-8"))
          source_version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "APP_VERSION" for target in node.targets)
          )
          assert source_version == version, "Source version mismatch"
          size = exe.stat().st_size
          assert 0 < size <= 5 * 1024**3, "Invalid installer size for single PUT"
          digest = hashlib.sha256()
          with exe.open("rb") as stream:
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          sha = digest.hexdigest()
          for receipt in (domestic, windows):
              assert receipt.get("version") == version, "Receipt version mismatch"
              assert receipt.get("sha256") == sha, "Receipt SHA-256 mismatch"
              assert type(receipt.get("size")) is int and receipt["size"] == size, "Receipt size mismatch"
              assert receipt.get("channel") == "domestic", "Receipt channel mismatch"
          assert domestic.get("manifest_url") == (
              "https://valorant-translator-update-1535709511.cos.ap-guangzhou.myqcloud.com/latest.json"
          ), "Receipt COS bucket mismatch"
          assert windows.get("commit") == commit, "Windows build commit mismatch"
          assert str(windows.get("run_id")) == "44478207822", "Windows build run mismatch"
          assert str(windows.get("run_attempt")) == "1", "Windows build attempt mismatch"
          assert windows.get("install_self_test") == "passed", "Installer self-test was not passed"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={sha}\nsize={size}\n")
          print(f"Verified installer: version={version}, size={size}, sha256={sha}")
          PY
      - name: Install pinned COS SDK
        run: python -m pip install -r requirements_publish.txt
      - name: Test multipart safety and CRC64
        run: cd release-tools && python -m unittest discover -s tests -p test_cos_b4_headers.py
      - name: Reuse or multipart upload verified installer
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_UPLOAD_ENDPOINT: ${{ inputs.endpoint }}
          EXPECTED_SHA256: ${{ steps.installer.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.installer.outputs.size }}
        run: python release-tools/scripts/upload_b4_cos.py

name: Windows beta build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Create environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cu128
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Configure public GitHub update channel
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m scripts.configure_updates "https://github.com/${{ github.repository }}"
      - name: Build portable executable
        shell: cmd
        run: build_windows.bat --ci
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ValorantTranslator.iss
      - name: Upload beta packages
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCNTranslator-Windows-Beta
          path: |
            dist/ValorantTranslator_Portable.zip
            dist/VoiceCNTranslator_Beta_Setup.exe
          if-no-files-found: error
      - name: Check installer size
        shell: pwsh
        run: |
          $size = (Get-Item "dist/VoiceCNTranslator_Beta_Setup.exe").Length
          Write-Host "Installer size: $size bytes"
          if ($size -ge 2147483648) { throw "Installer exceeds GitHub's 2 GiB release asset limit" }
      - name: Publish beta release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & .\.venv\Scripts\python.exe -c "from valorant_translator.version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/VoiceCNTranslator_Beta_Setup.exe" --clobber
          } else {
            gh release create $tag "dist/VoiceCNTranslator_Beta_Setup.exe" --title "队友语音翻译器 $tag 测试版" --notes "更新 Windows CUDA 12.8 运行库并加入 CUDA 推理失败后的 CPU 回退。GPU 效果需在测试者电脑验证；游戏内覆盖仍有 Riot 政策和反作弊风险。" --prerelease
          }

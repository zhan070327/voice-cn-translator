name: Whisper COS model assets
on:
  workflow_dispatch:
    inputs:
      publish_models:
        description: Publish verified models to COS after deployment approval
        type: boolean
        default: false
      confirmation:
        description: Type PUBLISH MODELS only after reviewing the model assets
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging>=24,<27' -r requirements_publish.txt
      - run: python -m scripts.package_whisper_models
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-base-cos
          path: dist/model-assets/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    if: inputs.publish_models && inputs.confirmation == 'PUBLISH MODELS' && github.ref == 'refs/heads/main'
    needs: package
    environment: cos-production
    concurrency:
      group: cos-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging>=24,<27' -r requirements_publish.txt
      - uses: actions/download-artifact@v4
        with:
          name: whisper-tiny-base-cos
          path: dist/model-assets
      - name: Verify archived ZIPs, then upload to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
        run: python -m scripts.package_whisper_models --publish-existing

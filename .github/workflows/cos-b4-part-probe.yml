name: Probe Guangzhou COS multipart writes

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'UploadPart route; bucket configuration and cleanup stay regional'
        required: true
        type: choice
        default: direct
        options:
          - direct
          - accelerate

permissions:
  contents: read

jobs:
  part-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cos-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned COS SDK
        run: python -m pip install -r requirements_publish.txt
      - name: Upload one temporary 1 MiB part and abort it
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_UPLOAD_ENDPOINT: ${{ inputs.endpoint }}
        run: python -m scripts.probe_b4_cos_part
